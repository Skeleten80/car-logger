<text x="40" y="762" font-family="sans-serif" font-size="12.5" fill="#333333">• T1/T2/T3 are the igniter-body labels for the ECU's IGT1/IGT2/IGT3. Coils fire on the falling edge (+5V -&gt; 0V), constant charge.</text>
<text x="40" y="788" font-family="sans-serif" font-size="12.5" fill="#333333">• The 2-pin coil connectors carry +B and the switched -ve only -- there is no chassis-ground wire on the coil.</text>
<text x="40" y="814" font-family="sans-serif" font-size="12.5" fill="#333333">• Factory +B is a common splice at the body-loom plug (BF2 pin 6), not a daisy-chain out of the igniter -- the splice is the single starvation point for all three packs.</text>
<text x="40" y="840" font-family="sans-serif" font-size="12.5" fill="#333333">• Coil connector cavity orientation (+B vs trigger) is undocumented: identify +B by the black/white wire and a key-ON 12V check.</text>
<text x="40" y="866" font-family="sans-serif" font-size="12.5" fill="#333333">• DH61 (Lexus) and DS62 (Toyota) igniters are interchangeable. Sources: Haltech 1JZ/2JZ tech doc, 2jzgarage, Wiring Specialties, wilbo666 JZS161 page.</text>
</svg>