<text x='40' y='982' text-anchor='start' font-family='sans-serif' font-size='15' fill='#333333'>•  Packs sit on the valve cover in physical order 1 - 3 - 2, front to back (per 2jzgarage / IS300 manual). Each fires its wasted-spark pair.</text>
<text x='40' y='1006' text-anchor='start' font-family='sans-serif' font-size='15' fill='#333333'>•  Factory +B splices at body-loom plug BF2 pin 6 -- the single starvation point for all three packs. T1/T2/T3 = igniter-body labels for ECU IGT1/2/3; coils fire on the falling edge (+5V -&gt; 0V).</text>
<text x='40' y='1030' text-anchor='start' font-family='sans-serif' font-size='15' fill='#333333'>•  2-pin coil connectors carry +B and the switched -ve only -- no chassis-ground wire. Cavity orientation is undocumented: use the black/white wire + key-ON 12V check.</text>
<text x='40' y='1054' text-anchor='start' font-family='sans-serif' font-size='15' fill='#333333'>•  DH61 (Lexus) and DS62 (Toyota) igniters are interchangeable. Igniter bay location not verified -- confirm on your car.</text>
</svg>